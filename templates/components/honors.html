<!-- ====== 荣誉奖项 ====== -->
<section class="section" id="honors">
  <div class="container">
    <div class="reveal">
      <h2 class="section-title">荣誉奖项</h2>
      <p class="section-sub">学术与竞赛成果</p>
    </div>
    <div class="honors-grid reveal">
      {% for honor in honors %}
      <div class="honor-card">
        <div class="honor-icon">
          {% if honor.icon == "award" %}
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
          {% elif honor.icon == "zap" %}
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          {% else %}
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          {% endif %}
        </div>
        <div class="honor-info">
          <h3 class="honor-title">{{ honor.title }}</h3>
          {% if honor.year %}
          <span class="honor-year">{{ honor.year }}</span>
          {% endif %}
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
