<!-- ====== 教育经历 ====== -->
<section class="section" id="education">
  <div class="container">
    <div class="reveal">
      <h2 class="section-title">教育经历</h2>
      <p class="section-sub">学术背景与研究方向</p>
    </div>
    <div class="timeline reveal">
      {% for edu in education %}
      <div class="timeline-item">
        <div class="timeline-dot"></div>
        <div class="timeline-card">
          <div class="timeline-header">
            <span class="timeline-school">{{ edu.school }}</span>
            <span class="timeline-badge">{{ edu.badge }}</span>
          </div>
          <div class="timeline-degree">{{ edu.degree }}</div>
          <div class="timeline-period">{{ edu.period }}</div>
          <p class="timeline-dir">{{ edu.direction }}</p>
          <ul class="timeline-highlights">
            {% for hl in edu.highlights %}
            <li>{{ hl }}</li>
            {% endfor %}
          </ul>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
