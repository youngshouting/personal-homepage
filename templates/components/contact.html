<!-- ====== 联系方式 ====== -->
<section class="section" id="contact">
  <div class="container">
    <div class="reveal">
      <h2 class="section-title">联系方式</h2>
      <p class="section-sub">欢迎交流与合作</p>
    </div>
    <div class="contact-grid reveal">
      <div class="contact-card">
        <div class="contact-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>
        </div>
        <h3>邮箱</h3>
        <p>{{ contact.email }}</p>
      </div>
      <div class="contact-card">
        <div class="contact-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
        </div>
        <h3>GitHub</h3>
        <p>{{ contact.github }}</p>
      </div>
      <div class="contact-card">
        <div class="contact-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <h3>所在地</h3>
        <p>{{ contact.location }}</p>
      </div>
    </div>

    <!-- 联系表单 -->
    <div class="contact-form reveal">
      <h3>给我留言</h3>
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
        <div class="flash-message flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
      {% endwith %}
      <form method="POST" action="{{ url_for('contact') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label for="name">姓名</label>
          <input type="text" id="name" name="name" required placeholder="你的名字">
        </div>
        <div class="form-group">
          <label for="email">邮箱</label>
          <input type="email" id="email" name="email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label for="message">留言</label>
          <textarea id="message" name="message" required placeholder="想说的话..."></textarea>
        </div>
        <div class="form-submit">
          <button type="submit" class="btn btn-primary">发送留言</button>
        </div>
      </form>
    </div>
  </div>
</section>
