<!-- ====== Hero ====== -->
<section class="hero">
  <div class="hero-grid"></div>
  <div class="hero-glow"></div>
  <div class="hero-content">
    <div class="hero-badge">{{ profile.badge }}</div>
    <h1 class="hero-name"><span>{{ profile.name }}</span></h1>
    <p class="hero-title">{{ profile.title }}</p>
    <p class="hero-desc">{{ profile.description }}</p>
    <div class="hero-actions">
      <a href="#projects" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        查看项目
      </a>
      <a href="#contact" class="btn btn-outline">联系我</a>
    </div>
  </div>
  <div class="scroll-hint">
    <span>向下滚动</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
  </div>
</section>
